name: CI-WorkFlow
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Removed cache: 'npm' so it doesn't look for a lock file

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
        if: hashFiles('npm-test/**/*.{js,ts,jsx,tsx}') != ''

      - name: Install dependencies
        run: cd npm-test && npm install

      - name: Build project
        run: cd npm-test && npm run build --if-present

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        if: hashFiles('npm-test/**/*.{js,ts,jsx,tsx}') != ''

      - name: Detect tests
        id: detect-tests
        run: |
          set -e
          HAS_TESTS=false
          # Check for common test file patterns or __tests__ folder
          if compgen -G "npm-test/**/*.test.js" > /dev/null || compgen -G "npm-test/**/*.test.ts" > /dev/null || [ -d "npm-test/__tests__" ]; then
            HAS_TESTS=true
          else
            # Check package.json test script; treat the default "No tests specified" as no-tests
            TEST_SCRIPT=$(node -e "console.log(require('./npm-test/package.json').scripts && require('./npm-test/package.json').scripts.test || '')")
            if [ -n "$TEST_SCRIPT" ] && ! echo "$TEST_SCRIPT" | grep -q "No tests specified"; then
              HAS_TESTS=true
            fi
          fi
          echo "has-tests=$HAS_TESTS" >> $GITHUB_OUTPUT

      - name: Run Tests
        if: steps.detect-tests.outputs.has-tests == 'true'
        run: cd npm-test && npm test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            dist/
            build/
            'package*.json'
          if-no-files-found: ignore

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Deploy application
        run: echo "my code is deployed"
